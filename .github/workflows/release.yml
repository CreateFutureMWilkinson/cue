name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      GO_VERSION: '1.26.1'
      GOTOOLCHAIN: auto
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true
          cache-dependency-path: go.sum

      - name: Install CGO dependencies (amd64 + arm64 cross-compile)
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture arm64
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libgl-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libxxf86vm-dev \
            libwayland-dev \
            libxkbcommon-dev \
            wayland-protocols \
            pkg-config \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libasound2-dev:arm64 \
            libgl-dev:arm64 \
            libxcursor-dev:arm64 \
            libxrandr-dev:arm64 \
            libxinerama-dev:arm64 \
            libxi-dev:arm64 \
            libxxf86vm-dev:arm64 \
            libwayland-dev:arm64 \
            libxkbcommon-dev:arm64

      - name: Run goreleaser (Linux targets)
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --skip=publish --config .goreleaser.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/*.tar.gz

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: linux-checksums
          path: dist/checksums.txt

  release-darwin:
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    env:
      GO_VERSION: '1.26.1'
      GOTOOLCHAIN: auto
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true
          cache-dependency-path: go.sum

      - name: Build darwin/arm64 binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -o dist/cue ./cmd/cue
          VERSION="${GITHUB_REF_NAME#v}"
          tar czf "dist/cue_${VERSION}_darwin_arm64.tar.gz" -C dist cue

      - name: Upload darwin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: darwin-release
          path: dist/*.tar.gz

  publish:
    needs: [release-linux, release-darwin]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
