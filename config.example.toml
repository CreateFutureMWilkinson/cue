# Cue Configuration
# ==================
# Copy this file to ~/.cue/config.toml and edit to suit your setup.
# If no config file exists, Cue creates one with these defaults on first run.
#
# Service accounts (Slack, Email) are configured in the Settings UI
# and stored in the application database — not in this file.

# ─── Database ───────────────────────────────────────────────
[database]
# Path to the SQLite database file.
# Supports ~ for home directory.
path = "~/.cue/messages.db"

# ─── Ollama (Local LLM) ────────────────────────────────────
[ollama]
# Ollama server connection details.
# Models must be pulled locally before use:
#   ollama pull neural-chat
#   ollama pull nomic-embed-text
host = "localhost"
port = 11434

# Model used for message importance scoring.
inference_model = "neural-chat"

# Model used for generating vector embeddings.
embedding_model = "nomic-embed-text"

# Timeout in seconds for Ollama API calls.
# Messages exceeding this are scored IS=7, CS=0.0 (BUFFERED).
timeout_seconds = 10

# ─── Routing Thresholds ────────────────────────────────────
[orchestrator]
# How often (seconds) to poll all configured watchers.
poll_interval_seconds = 600

# Cooldown (seconds) between Ollama scoring attempts after failure.
ollama_cooldown_seconds = 10

[orchestrator.router]
# Messages scoring >= importance AND >= confidence → NOTIFIED.
# Messages scoring >= importance AND < confidence → BUFFERED.
# All others → IGNORED.
importance_threshold = 7
confidence_threshold = 0.8

# Maximum messages retained per source (FIFO eviction).
buffer_size_per_source = 100

# Warn in activity log when pending queue exceeds this count.
queue_warning_threshold = 50

# ─── Calibration-Assisted Routing ────────────────────────────
# When enabled, historical user feedback (vector similarity)
# influences future scoring adjustments.
calibration_enabled = false

# Minimum cosine similarity to consider a feedback match (0.0-1.0).
calibration_similarity_threshold = 0.75

# Maximum number of similar past messages to consider.
calibration_max_examples = 5

# ─── Notifications & Audio ─────────────────────────────────
[notification]
# Master toggle for audio alerts.
audio_enabled = true

# Directory containing custom notification sounds.
# Leave empty to use system fallback beep.
audio_dir = ""

# Minimum seconds between consecutive audio alerts.
audio_cooldown_seconds = 2

# Volume level (0-100).
audio_volume = 100

# Fallback beep frequency in Hz (used when no audio files available).
fallback_frequency = 1000

# Fallback beep duration in milliseconds.
fallback_duration_ms = 200

# ─── GUI ────────────────────────────────────────────────────
[gui]
# Initial window dimensions.
window_width = 1200
window_height = 800

# Character displayed in the center area.
# Options: "none", "fairy"
character = "none"

# Directory containing character WASM plugins.
# Supports ~ for home directory.
character_dir = "~/.cue/characters"

# ─── Logging ────────────────────────────────────────────────
[logging]
# Log level: "debug", "info", "warn", "error"
log_level = "info"

# Directory for log files. Empty = stderr only.
log_dir = ""

# ─── Day Planner ───────────────────────────────────────────
# Uncomment this section to enable the day planner.
# All fields are required if any planner field is set.

# [planner]
# workday_start = "09:00"
# workday_end = "17:00"
# planning_cutoff = "16:00"
# pomodoro_minutes = 25
# short_break_minutes = 5
# long_break_minutes = 20
# long_break_after_cycles = 4
# meeting_merge_gap_minutes = 5
# lunch_window_start = "12:00"
# lunch_window_end = "14:00"
# timer_sound = ""
# timer_volume = 75

# ─── Server (Headless HTTP/WebSocket) ─────────────────────
# Uncomment this section to configure the cue-server binary.
# The GUI binary ignores this section; the server binary ignores [gui].

# [server]
# host = "0.0.0.0"
# port = 7130
# read_timeout_seconds = 30
# write_timeout_seconds = 30
