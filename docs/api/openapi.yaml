            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Internal Server Error
      summary: Get day schedule
      tags:
      - planner
    put:
      description: |-
        Replaces the schedule for the given date with the provided blocks.
        Block times use HH:MM (24h) and are anchored to the path date.
      parameters:
