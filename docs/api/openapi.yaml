          type: object
        total_buffered:
          type: integer
      type: object
    handler.bufferedListResponse:
      properties:
        count:
          type: integer
        messages:
          items:
            $ref: '#/components/schemas/handler.bufferedMessageItem'
          type: array
          uniqueItems: false
        total:
          type: integer
      type: object
    handler.bufferedMessageItem:
      properties:
        channel:
          type: string
        confidence_score:
          type: number
        content:
          type: string
        created_at:
          type: string
        id:
          type: string
        importance_score:
          type: number
        reasoning:
          type: string
        sender:
          type: string
        source:
          type: string
        source_account:
          type: string
