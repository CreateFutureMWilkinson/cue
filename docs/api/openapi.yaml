externalDocs:
  description: WebSocket event channel reference
  url: https://git.hrafn.xyz/aether/cue/src/branch/main/docs/api/websocket.md
info:
  description: |-
    Cue is a local-first, privacy-centric productivity assistant.
    This REST API exposes messages, notifications, feedback buffer,
    tasks, day planner, routing rules, service configuration, timer,
    auth/pairing, and event replay. The WebSocket event channel at
    /api/v1/websocket/events is documented separately in
    docs/api/websocket.md.
  title: Cue API
  version: "1.0"
openapi: 3.1.0
paths:
  /api/v1/auth/pair:
    post:
      description: |-
        Creates a pairing request, returning a request_id and a short
        numeric code the user types into the desktop UI to approve.
        Also broadcasts a "pairing_request" event over the WebSocket
        channel for already-paired clients to display.
      requestBody:
        content:
          application/json:
            schema:
              type: object
          text/plain:
            schema:
              title: request
              type: object
        description: 'Optional {label: string} for the new device'
      responses:
        "202":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: Accepted
      summary: Begin a pairing handshake
      tags:
      - auth
  /api/v1/auth/pair/{id}:
    get:
      description: |-
        Returns the current status of a pairing request. Once the
        request is approved, the response includes the bearer token
        the client must use for subsequent authenticated requests.
      parameters:
      - description: Pairing request UUID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Not Found
      summary: Poll pairing request status
      tags:
      - auth
  /api/v1/auth/pair/{id}/approve:
    post:
      description: |-
        Generates a fresh bearer token, persists its hash, attaches
        the plaintext to the pairing request (so the polling client
        can pick it up), and broadcasts a "pairing_resolved" event.
      parameters:
      - description: Pairing request UUID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Bad Request
        "409":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: request already resolved
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Internal Server Error
      summary: Approve a pending pairing request
      tags:
      - auth
  /api/v1/auth/pair/{id}/deny:
    post:
      parameters:
      - description: Pairing request UUID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Bad Request
        "409":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: request already resolved
      summary: Deny a pending pairing request
      tags:
      - auth
  /api/v1/auth/tokens:
    get:
      description: |-
        Returns metadata for all paired tokens (id, label, timestamps,
        revoked flag). Plaintext tokens are never returned by this API.
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  type: object
                type: array
          description: OK
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Internal Server Error
      summary: List bearer tokens
      tags:
      - auth
  /api/v1/auth/tokens/{id}:
    delete:
      description: |-
        Marks the token as revoked. Future requests using the token
        will fail authentication.
      parameters:
      - description: Token UUID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Internal Server Error
      summary: Revoke a bearer token
      tags:
      - auth
    put:
      parameters:
      - description: Token UUID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
          text/plain:
            schema:
              title: request
              type: object
        description: '{label: string}'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Internal Server Error
      summary: Update bearer token label
      tags:
      - auth
  /api/v1/buffer:
    get:
      description: |-
        Paginated list of messages awaiting user review (status = Buffered),
        sorted by created_at descending.
      parameters:
      - description: Page size (default 50)
        in: query
        name: limit
        schema:
          type: integer
      - description: Page offset (default 0)
        in: query
        name: offset
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.bufferedListResponse'
          description: OK
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Internal Server Error
      summary: List buffered messages
      tags:
      - buffer
  /api/v1/buffer/{id}:
    delete:
      description: |-
        Deletes the message from the buffer without recording a rating.
        Returns 409 if the message has already been resolved.
      parameters:
      - description: Message UUID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.messageDetail'
          description: OK
        "404":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: already resolved
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Internal Server Error
      summary: Remove a buffered message
      tags:
      - buffer
    get:
      description: |-
        Returns a single buffered message. Responds 404 if the message
        exists but has a non-Buffered status.
      parameters:
      - description: Message UUID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.messageDetail'
          description: OK
        "404":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Internal Server Error
      summary: Get buffered message by ID
      tags:
      - buffer
  /api/v1/buffer/{id}/rate:
    post:
      description: |-
        Records a 0–10 user rating plus optional free-text feedback and
        moves the message out of the buffer. Returns 409 if the message
        has already been resolved.
      parameters:
      - description: Message UUID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.rateRequest'
                description: Rating (0–10) and optional feedback
                summary: request
        description: Rating (0–10) and optional feedback
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.messageDetail'
          description: OK
        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: already resolved
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Internal Server Error
      summary: Rate a buffered message
      tags:
      - buffer
  /api/v1/buffer/stats:
    get:
      description: Returns the total count of buffered messages and a breakdown by
        source.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.bufferStatsResponse'
          description: OK
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Internal Server Error
      summary: Buffer summary statistics
      tags:
      - buffer
  /api/v1/events:
    get:
      description: |-
        Returns all WebSocket events with sequence numbers greater than
        `since`. Clients use this after reconnecting to catch up on
        events missed while disconnected. Payload is a JSON array of
        EventEnvelope objects matching those pushed over the WebSocket
        channel; see docs/api/websocket.md for the envelope schema.
      parameters:
      - description: Last seq received by the client
        in: query
        name: since
        required: true
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  type: object
                type: array
          description: OK
        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: invalid since parameter
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: internal error
      summary: Replay buffered events
      tags:
      - events
  /api/v1/health:
    get:
      description: |-
        Returns 200 {"status":"ok"} whenever the HTTP server is running.
        Does not inspect any subsystem; use /health/ready for readiness.
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
      summary: Liveness check
      tags:
      - health
  /api/v1/health/ready:
    get:
      description: |-
        Runs every registered subsystem check and returns 200 only if
        all report healthy. Returns 503 with per-subsystem error detail
        when any check fails. The response body always includes a
        "subsystems" object keyed by subsystem name.
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: OK
        "503":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: Service Unavailable
      summary: Readiness check
      tags:
      - health
  /api/v1/messages:
    get:
      description: |-
        Paginated list of all ingested messages, filterable by status,
        source (slack/email), channel, and since (RFC3339).
      parameters:
      - description: Notified | Buffered | Ignored | Resolved | Pending
        in: query
        name: status
        schema:
          type: string
      - description: slack | email
        in: query
        name: source
        schema:
          type: string
      - description: Source-native channel / folder
        in: query
        name: channel
        schema:
          type: string
      - description: RFC3339 lower bound on created_at
        in: query
        name: since
        schema:
          type: string
      - description: Page size (default 50)
        in: query
        name: limit
        schema:
          type: integer
      - description: Page offset (default 0)
        in: query
        name: offset
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.messagesListResponse'
          description: OK
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Internal Server Error
      summary: List messages
      tags:
      - messages
  /api/v1/messages/{id}:
    get:
      parameters:
      - description: Message UUID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.messageDetail'
          description: OK
        "404":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Internal Server Error
      summary: Get message by ID
      tags:
      - messages
  /api/v1/notifications:
    get:
      description: |-
        Paginated list of messages currently in the Notified state,
        sorted by created_at descending.
      parameters:
      - description: Page size (default 50)
        in: query
        name: limit
        schema:
          type: integer
      - description: Page offset (default 0)
        in: query
        name: offset
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.listResponse'
          description: OK
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Internal Server Error
      summary: List active notifications
      tags:
      - notifications
  /api/v1/notifications/{id}:
    get:
      parameters:
      - description: Notification / message UUID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.messageDetail'
          description: OK
        "404":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Internal Server Error
      summary: Get notification by ID
      tags:
      - notifications
  /api/v1/notifications/{id}/dismiss:
    post:
      description: Marks the notification as Ignored. Unlike resolve, no resolved_at
        timestamp is set.
      parameters:
