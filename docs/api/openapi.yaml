      description: |-
        Returns the saved schedule for a given date. Mounted twice:
        /api/v1/planner/{date} for explicit dates (YYYY-MM-DD), and
        /api/v1/planner/active which substitutes today's UTC date.
      parameters:
      - description: YYYY-MM-DD
        in: path
        name: date
        required: true
