          type: string
        total_focus_minutes:
          type: integer
      type: object
    handler.generateRequest:
      properties:
        date:
          type: string
      type: object
    handler.generateResponse:
      properties:
        date:
          type: string
        options:
          items:
            $ref: '#/components/schemas/handler.generateOptionItem'
          type: array
          uniqueItems: false
      type: object
    handler.listResponse:
      properties:
        notifications:
          items:
            $ref: '#/components/schemas/handler.notificationItem'
          type: array
          uniqueItems: false
        total:
          type: integer
      type: object
    handler.messageDetail:
      properties:
        channel:
          type: string
        confidence_score:
          type: number
        content:
          type: string
        created_at:
          type: string
        id:
          type: string
        importance_score:
          type: number
        message_id:
          type: string
        reasoning:
          type: string
        resolved_at:
          type: string
        sender:
          type: string
        source:
          type: string
        source_account:
          type: string
        status:
          type: string
        updated_at:
          type: string
      type: object
    handler.messageListItem:
      properties:
        channel:
          type: string
        confidence_score:
          type: number
        content:
          type: string
        created_at:
          type: string
        id:
          type: string
        importance_score:
          type: number
        sender:
          type: string
        source:
          type: string
        source_account:
          type: string
        status:
          type: string
      type: object
    handler.messagesListResponse:
      properties:
        messages:
          items:
            $ref: '#/components/schemas/handler.messageListItem'
          type: array
          uniqueItems: false
        total:
          type: integer
      type: object
    handler.notificationItem:
      properties:
        channel:
          type: string
        confidence_score:
          type: number
        content:
          type: string
        created_at:
          type: string
        id:
          type: string
        importance_score:
          type: number
        sender:
          type: string
        source:
          type: string
        source_account:
          type: string
      type: object
    handler.putScheduleRequest:
      properties:
        blocks:
          items:
            $ref: '#/components/schemas/handler.scheduleBlockItem'
          type: array
          uniqueItems: false
        strategy:
          type: string
      type: object
    handler.rateRequest:
      properties:
        feedback:
          type: string
        rating:
          type: integer
      type: object
    handler.scheduleBlockItem:
      properties:
        end:
          type: string
        start:
          type: string
        task_id:
          type: string
        task_name:
          type: string
        type:
          type: string
      type: object
    handler.scheduleResponse:
      properties:
        blocks:
          items:
            $ref: '#/components/schemas/handler.scheduleBlockItem'
          type: array
          uniqueItems: false
        created_at:
          type: string
        date:
          type: string
        strategy:
          type: string
      type: object
    handler.taskItem:
      properties:
        categories:
          items:
            type: string
          type: array
          uniqueItems: false
        completed_at:
          type: string
        created_at:
          type: string
        description:
          type: string
        due_date:
          type: string
        effective_estimate_minutes:
          type: integer
        estimate_minutes:
          type: integer
        id:
          type: string
        llm_estimate_minutes:
          type: integer
        priority:
          type: integer
        title:
          type: string
      type: object
    handler.taskListResponse:
      properties:
        count:
          type: integer
        tasks:
          items:
            $ref: '#/components/schemas/handler.taskItem'
          type: array
          uniqueItems: false
        total:
          type: integer
      type: object
    handler.timerResponse:
      properties:
        block_type:
          type: string
        display_time:
          type: string
        duration_seconds:
          type: integer
        elapsed_fraction:
          type: number
        elapsed_seconds:
          type: integer
        remaining_seconds:
          type: integer
        running:
          type: boolean
        task_name:
          type: string
      type: object
    handler.updateTaskRequest:
      properties:
        categories:
          items:
            type: string
          type: array
          uniqueItems: false
        completed_at:
          type: string
        description:
          type: string
        due_date:
          type: string
        estimate_minutes:
          type: integer
        priority:
          type: integer
        title:
          type: string
      type: object
externalDocs:
  description: WebSocket event channel reference
  url: https://git.hrafn.xyz/aether/cue/src/branch/main/docs/api/websocket.md
info:
  description: |-
    Cue is a local-first, privacy-centric productivity assistant.
    This REST API exposes messages, notifications, feedback buffer,
    tasks, day planner, routing rules, service configuration, timer,
    auth/pairing, and event replay. The WebSocket event channel at
    /api/v1/websocket/events is documented separately in
    docs/api/websocket.md.
  title: Cue API
  version: "1.0"
openapi: 3.1.0
paths:
  /api/v1/buffer:
    get:
      description: |-
        Paginated list of messages awaiting user review (status = Buffered),
        sorted by created_at descending.
      parameters:
      - description: Page size (default 50)
        in: query
        name: limit
        schema:
          type: integer
      - description: Page offset (default 0)
        in: query
        name: offset
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.bufferedListResponse'
          description: OK
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Internal Server Error
      summary: List buffered messages
      tags:
      - buffer
  /api/v1/buffer/{id}:
    delete:
      description: |-
        Deletes the message from the buffer without recording a rating.
        Returns 409 if the message has already been resolved.
      parameters:
      - description: Message UUID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.messageDetail'
          description: OK
        "404":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: already resolved
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Internal Server Error
      summary: Remove a buffered message
      tags:
      - buffer
    get:
      description: |-
        Returns a single buffered message. Responds 404 if the message
        exists but has a non-Buffered status.
      parameters:
      - description: Message UUID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.messageDetail'
          description: OK
        "404":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Internal Server Error
      summary: Get buffered message by ID
      tags:
      - buffer
  /api/v1/buffer/{id}/rate:
    post:
      description: |-
        Records a 0–10 user rating plus optional free-text feedback and
        moves the message out of the buffer. Returns 409 if the message
        has already been resolved.
      parameters:
      - description: Message UUID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.rateRequest'
                description: Rating (0–10) and optional feedback
                summary: request
        description: Rating (0–10) and optional feedback
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.messageDetail'
          description: OK
        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: already resolved
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Internal Server Error
      summary: Rate a buffered message
      tags:
      - buffer
  /api/v1/buffer/stats:
    get:
      description: Returns the total count of buffered messages and a breakdown by
        source.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.bufferStatsResponse'
          description: OK
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Internal Server Error
      summary: Buffer summary statistics
      tags:
      - buffer
  /api/v1/events:
    get:
      description: |-
        Returns all WebSocket events with sequence numbers greater than
        `since`. Clients use this after reconnecting to catch up on
        events missed while disconnected. Payload is a JSON array of
        EventEnvelope objects matching those pushed over the WebSocket
        channel; see docs/api/websocket.md for the envelope schema.
      parameters:
      - description: Last seq received by the client
        in: query
        name: since
        required: true
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  type: object
                type: array
          description: OK
        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: invalid since parameter
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: internal error
      summary: Replay buffered events
      tags:
      - events
  /api/v1/health:
    get:
      description: |-
        Returns 200 {"status":"ok"} whenever the HTTP server is running.
        Does not inspect any subsystem; use /health/ready for readiness.
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
      summary: Liveness check
      tags:
      - health
  /api/v1/health/ready:
    get:
      description: |-
        Runs every registered subsystem check and returns 200 only if
        all report healthy. Returns 503 with per-subsystem error detail
        when any check fails. The response body always includes a
        "subsystems" object keyed by subsystem name.
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: OK
        "503":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: Service Unavailable
      summary: Readiness check
      tags:
      - health
  /api/v1/messages:
    get:
      description: |-
        Paginated list of all ingested messages, filterable by status,
        source (slack/email), channel, and since (RFC3339).
      parameters:
      - description: Notified | Buffered | Ignored | Resolved | Pending
        in: query
        name: status
        schema:
          type: string
      - description: slack | email
        in: query
        name: source
        schema:
          type: string
      - description: Source-native channel / folder
        in: query
        name: channel
        schema:
          type: string
      - description: RFC3339 lower bound on created_at
        in: query
        name: since
        schema:
          type: string
      - description: Page size (default 50)
        in: query
        name: limit
        schema:
          type: integer
      - description: Page offset (default 0)
        in: query
        name: offset
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.messagesListResponse'
          description: OK
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Internal Server Error
      summary: List messages
      tags:
      - messages
  /api/v1/messages/{id}:
    get:
      parameters:
      - description: Message UUID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.messageDetail'
          description: OK
        "404":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Internal Server Error
      summary: Get message by ID
      tags:
      - messages
  /api/v1/notifications:
    get:
      description: |-
        Paginated list of messages currently in the Notified state,
        sorted by created_at descending.
      parameters:
      - description: Page size (default 50)
        in: query
        name: limit
        schema:
          type: integer
      - description: Page offset (default 0)
        in: query
        name: offset
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.listResponse'
          description: OK
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Internal Server Error
      summary: List active notifications
      tags:
      - notifications
  /api/v1/notifications/{id}:
    get:
      parameters:
      - description: Notification / message UUID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.messageDetail'
          description: OK
        "404":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Internal Server Error
      summary: Get notification by ID
      tags:
      - notifications
  /api/v1/notifications/{id}/dismiss:
    post:
      description: Marks the notification as Ignored. Unlike resolve, no resolved_at
        timestamp is set.
      parameters:
      - description: Notification UUID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.messageDetail'
          description: OK
        "404":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Internal Server Error
      summary: Dismiss a notification
      tags:
      - notifications
  /api/v1/notifications/{id}/resolve:
    post:
      description: |-
        Marks the notification as resolved and sets resolved_at to now.
        Returns 409 if the notification is already resolved.
      parameters:
      - description: Notification UUID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.messageDetail'
          description: OK
        "404":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: already resolved
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Internal Server Error
      summary: Resolve a notification
      tags:
      - notifications
  /api/v1/planner/{date}:
    delete:
      description: |-
        Removes the saved schedule for the given date. Also served at
        /api/v1/planner/active for today's UTC date.
      parameters:
      - description: YYYY-MM-DD
        in: path
        name: date
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Internal Server Error
      summary: Delete day schedule
      tags:
      - planner
    get:
      description: |-
        Returns the saved schedule for a given date. Mounted twice:
        /api/v1/planner/{date} for explicit dates (YYYY-MM-DD), and
        /api/v1/planner/active which substitutes today's UTC date.
      parameters:
      - description: YYYY-MM-DD
        in: path
        name: date
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.scheduleResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Internal Server Error
      summary: Get day schedule
      tags:
      - planner
    put:
      description: |-
        Replaces the schedule for the given date with the provided blocks.
        Block times use HH:MM (24h) and are anchored to the path date.
      parameters:
      - description: YYYY-MM-DD
        in: path
        name: date
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.putScheduleRequest'
                description: Strategy + blocks
                summary: request
        description: Strategy + blocks
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.scheduleResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Internal Server Error
      summary: Save day schedule
      tags:
      - planner
  /api/v1/planner/generate:
    post:
      description: |-
        Produces two schedule options (focus-heavy and recovery) for the
        target date using calendar events. If the request body omits
        "date", the planner's default target (usually today or tomorrow)
        is used.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.generateRequest'
                description: Optional target date
                summary: request
        description: Optional target date
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.generateResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Internal Server Error
      summary: Generate candidate schedules
      tags:
      - planner
  /api/v1/tasks:
    get:
      description: |-
        Paginated list of todo items, filterable by status, category,
        and free-text search across title/description.
      parameters:
      - description: open | completed
        in: query
        name: status
        schema:
          type: string
      - description: Category name
        in: query
        name: category
        schema:
          type: string
      - description: Substring match on title/description
        in: query
        name: search
        schema:
          type: string
      - description: Page size (default 50)
        in: query
        name: limit
        schema:
          type: integer
      - description: Page offset (default 0)
        in: query
        name: offset
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.taskListResponse'
          description: OK
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Internal Server Error
      summary: List tasks
      tags:
      - tasks
    post:
      description: |-
        Creates a new task. Title is required. Accepts YYYY-MM-DD or
        RFC3339 for due_date.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.createTaskRequest'
                description: Task fields
                summary: request
        description: Task fields
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.taskItem'
          description: Created
        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Internal Server Error
      summary: Create task
      tags:
      - tasks
  /api/v1/tasks/{id}:
    delete:
      parameters:
      - description: Task UUID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "404":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Internal Server Error
      summary: Delete task
      tags:
      - tasks
    get:
      parameters:
      - description: Task UUID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.taskItem'
          description: OK
        "404":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Internal Server Error
      summary: Get task by ID
      tags:
      - tasks
    put:
      description: |-
        Partial update: any non-nil field in the body is applied to
        the existing task. Unspecified fields retain their current value.
      parameters:
      - description: Task UUID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.updateTaskRequest'
                description: Fields to update
                summary: request
        description: Fields to update
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.taskItem'
          description: OK
        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Internal Server Error
      summary: Update task
      tags:
      - tasks
  /api/v1/timer:
    get:
      description: |-
        Returns the live Pomodoro timer state derived from today's schedule.
        When no schedule exists or no block is currently active, responds
        with {"running": false} and 200 OK.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.timerResponse'
          description: OK
      summary: Current timer state
      tags:
      - timer
  /health:
    get:
      description: |-
        Returns 200 {"status":"ok"} whenever the HTTP server is running.
        Does not inspect any subsystem; use /health/ready for readiness.
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
      summary: Liveness check
      tags:
      - health
  /health/ready:
    get:
      description: |-
        Runs every registered subsystem check and returns 200 only if
        all report healthy. Returns 503 with per-subsystem error detail
        when any check fails. The response body always includes a
        "subsystems" object keyed by subsystem name.
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: OK
        "503":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: Service Unavailable
      summary: Readiness check
      tags:
      - health
